<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>招远方言 · 你画我猜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(135deg,#ffe9a8,#ffc7d1 60%,#c7e0ff); min-height:100vh; color:#333; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input { font-family:inherit; }

  /* ---------- 大厅 ---------- */
  #lobby { max-width:420px; margin:0 auto; padding:60px 20px; text-align:center; }
  #lobby h1 { font-size:34px; color:#d43d1a; text-shadow:2px 2px 0 #fff; margin-bottom:6px; }
  #lobby .sub { color:#8a5a00; margin-bottom:30px; font-size:14px; }
  .card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 6px 20px rgba(0,0,0,.12); }
  .card input { width:100%; padding:12px 14px; font-size:16px; border:2px solid #eee; border-radius:10px; margin-bottom:12px; outline:none; }
  .card input:focus { border-color:#ff9f43; }
  .btn { display:inline-block; padding:12px 32px; font-size:17px; font-weight:bold; color:#fff;
         background:linear-gradient(180deg,#ffb142,#ff793f); border-radius:12px;
         box-shadow:0 4px 0 #d35400; transition:transform .05s; width:100%; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #d35400; }
  .btn.green { background:linear-gradient(180deg,#2ed573,#1e9e50); box-shadow:0 4px 0 #157a3c; }
  .btn.small { width:auto; padding:8px 18px; font-size:14px; }
  .tip { font-size:12px; color:#999; margin-top:14px; line-height:1.8; }
  #lobbyErr { color:#e74c3c; font-size:14px; min-height:20px; margin-bottom:8px; }

  /* ---------- 游戏主界面 ---------- */
  #game { display:none; max-width:1100px; margin:0 auto; padding:10px; }
  #topbar { display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:8px 14px; box-shadow:0 3px 10px rgba(0,0,0,.1); margin-bottom:10px; flex-wrap:wrap; }
  #roomTag { background:#6c5ce7; color:#fff; border-radius:8px; padding:4px 10px; font-weight:bold; font-size:14px; }
  #roundInfo { font-weight:bold; color:#555; font-size:14px; }
  #timer { margin-left:auto; font-size:22px; font-weight:bold; color:#fff; background:#ff6b6b; border-radius:50%; width:52px; height:52px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #timer.low { animation:pulse .5s infinite alternate; }
  @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.15)} }

  #wordBar { background:#fff8e1; border:2px dashed #f0b429; border-radius:12px; padding:10px 16px; margin-bottom:10px; font-size:17px; text-align:center; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  #wordBar .wd { font-size:24px; font-weight:bold; color:#d43d1a; letter-spacing:2px; }
  #wordBar .hintTag { background:#f0b429; color:#fff; border-radius:6px; padding:2px 8px; font-size:13px; }

  #main { display:flex; gap:10px; }
  #left { flex:1; min-width:0; }
  #right { width:270px; display:flex; flex-direction:column; gap:10px; }

  #canvasWrap { position:relative; background:#fff; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,.1); overflow:hidden; }
  canvas { display:block; width:100%; touch-action:none; }
  #canvasWrap.notMine canvas { cursor:not-allowed; }

  #toolbar { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#fff; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,.1); margin-top:8px; flex-wrap:wrap; }
  #toolbar.disabled { opacity:.4; pointer-events:none; }
  .colorDot { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #ccc; }
  .colorDot.sel { box-shadow:0 0 0 3px #333; transform:scale(1.15); }
  .toolBtn { padding:6px 10px; border-radius:8px; background:#f1f2f6; font-size:14px; }
  .toolBtn.sel { background:#3742fa; color:#fff; }

  /* 玩家榜 */
  #players { background:#fff; border-radius:12px; padding:10px; box-shadow:0 3px 10px rgba(0,0,0,.1); }
  #players h3 { font-size:14px; color:#888; margin-bottom:6px; }
  .pRow { display:flex; align-items:center; gap:6px; padding:6px 4px; border-radius:8px; font-size:14px; }
  .pRow.drawing { background:#fff3d6; }
  .pRow .brush { color:#e67e22; }
  .pRow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pRow .sc { font-weight:bold; color:#e67e22; }
  .pRow .ok { color:#2ed573; font-weight:bold; }

  /* 聊天/猜词 */
  #chatBox { background:#fff; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,.1); display:flex; flex-direction:column; flex:1; min-height:200px; }
  #chatLog { flex:1; overflow-y:auto; padding:8px 10px; font-size:14px; max-height:320px; }
  #chatLog .msg { margin-bottom:5px; line-height:1.5; word-break:break-all; }
  #chatLog .sys { color:#999; font-size:12px; }
  #chatLog .good { color:#1e9e50; font-weight:bold; }
  #chatLog .nm { color:#6c5ce7; font-weight:bold; }
  #guessRow { display:flex; gap:6px; padding:8px; border-top:1px solid #eee; }
  #guessInput { flex:1; padding:9px 10px; border:2px solid #eee; border-radius:8px; font-size:15px; outline:none; min-width:0; }
  #guessInput:focus { border-color:#ff9f43; }
  #guessBtn { padding:9px 16px; border-radius:8px; background:#ff9f43; color:#fff; font-weight:bold; }

  /* 遮罩层（回合结果 / 总结算 / 等待） */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay .panel { background:#fff; border-radius:18px; padding:28px; max-width:420px; width:100%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .panel h2 { color:#d43d1a; margin-bottom:10px; }
  .panel .bigWord { font-size:32px; font-weight:bold; color:#3742fa; margin:10px 0; letter-spacing:3px; }
  .panel .mean { color:#666; margin-bottom:16px; }
  .rankRow { display:flex; padding:8px 12px; border-radius:8px; margin-bottom:6px; background:#f8f9fa; font-size:15px; }
  .rankRow:nth-child(1) { background:#fff3d6; }
  .rankRow .rk { width:30px; font-weight:bold; }
  .rankRow .rn { flex:1; text-align:left; }
  .rankRow .rs { font-weight:bold; color:#e67e22; }
  #countdownNum { font-size:16px; color:#888; margin-top:10px; }

  @media (max-width:820px) {
    #main { flex-direction:column; }
    #right { width:100%; }
    #chatLog { max-height:180px; }
  }
</style>
</head>
<body>

<!-- ============ 大厅 ============ -->
<div id="lobby">
  <h1>招远方言 · 你画我猜</h1>
  <div class="sub">街巴子、布嘎、洋四儿…… 不是招远银，还真猜不着！</div>
  <div class="card">
    <input id="nameInput" placeholder="你的昵称" maxlength="12">
    <input id="roomInput" placeholder="房间号（随便写个数，朋友填一样的）" maxlength="10">
    <div id="lobbyErr"></div>
    <button class="btn" id="joinBtn">进 屋</button>
    <div class="tip">
      玩法（参考"玩吧"）：一人画，其他人打字猜招远话，猜对得分，画的人也得辛苦分；<br>
      每人轮一次，最后看总分排名。朋友连同一个 WiFi，打开同一个网址+房间号即可。
    </div>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div id="game">
  <div id="topbar">
    <span id="roomTag">房间 ----</span>
    <span id="roundInfo">等待开局</span>
    <span id="timer">--</span>
  </div>

  <div id="wordBar">等房主开局……</div>

  <div id="main">
    <div id="left">
      <div id="canvasWrap" class="notMine"><canvas id="cv" width="1000" height="640"></canvas></div>
      <div id="toolbar" class="disabled">
        <div id="colors" style="display:flex;gap:6px;"></div>
        <button class="toolBtn sel" data-size="4">细</button>
        <button class="toolBtn" data-size="9">中</button>
        <button class="toolBtn" data-size="18">粗</button>
        <button class="toolBtn" id="eraserBtn">橡皮</button>
        <button class="toolBtn" id="clearBtn">清空</button>
      </div>
    </div>

    <div id="right">
      <div id="players"><h3>玩家</h3><div id="playerList"></div></div>
      <div id="chatBox">
        <div id="chatLog"></div>
        <div id="guessRow">
          <input id="guessInput" placeholder="输入你猜的招远话…" maxlength="20" disabled>
          <button id="guessBtn">猜!</button>
        </div>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin-top:10px;">
    <button class="btn green small" id="startBtn" style="display:none;">开始游戏</button>
  </div>
</div>

<!-- 回合结算 -->
<div class="overlay" id="roundOverlay">
  <div class="panel">
    <h2 id="roTitle">时间到！</h2>
    <div>这个词是</div>
    <div class="bigWord" id="roWord"></div>
    <div class="mean" id="roMean"></div>
    <div id="countdownNum">5 秒后下一轮…</div>
  </div>
</div>

<!-- 总结算 -->
<div class="overlay" id="overOverlay">
  <div class="panel">
    <h2>🏆 总结算</h2>
    <div id="rankList"></div>
    <button class="btn green" id="againBtn" style="display:none;margin-top:10px;">再来一局</button>
    <div class="tip" id="againTip">等房主点"再来一局"</div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  let ws, myId = null, hostId = null, isDrawer = false, gameState = 'lobby';
  let timerInt = null, timeLeft = 0;

  // ---------- 画布 ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = 1000, H = 640;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  function white() { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H); }
  white();

  let color = '#e74c3c', size = 4, eraser = false, drawing = false, lx = 0, ly = 0;
  const COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#3742fa','#9b59b6','#ff6b9d','#000000','#8d6e63','#ffffff'];
  const colorBox = $('colors');
  COLORS.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'colorDot' + (i===0 ? ' sel' : '');
    b.style.background = c;
    b.onclick = () => { color = c; eraser = false; $('eraserBtn').classList.remove('sel');
      [...colorBox.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
    colorBox.appendChild(b);
  });
  document.querySelectorAll('.toolBtn[data-size]').forEach(b => {
    b.onclick = () => { size = +b.dataset.size;
      document.querySelectorAll('.toolBtn[data-size]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); };
  });
  $('eraserBtn').onclick = () => { eraser = true; $('eraserBtn').classList.add('sel'); };
  $('clearBtn').onclick = () => { white(); send({t:'clear'}); };

  function toLogic(e) {
    const r = cv.getBoundingClientRect();
    const px = (e.clientX ?? (e.touches && e.touches[0].clientX));
    const py = (e.clientY ?? (e.touches && e.touches[0].clientY));
    return { x: (px - r.left) / r.width * W, y: (py - r.top) / r.height * H };
  }
  function drawSeg(x0,y0,x1,y1,c,s,er) {
    ctx.strokeStyle = er ? '#ffffff' : c;
    ctx.lineWidth = er ? s * 3 : s;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  function onDown(e) {
    if (!isDrawer || gameState !== 'playing') return;
    e.preventDefault();
    drawing = true;
    const p = toLogic(e); lx = p.x; ly = p.y;
    drawSeg(lx, ly, lx + 0.1, ly + 0.1, color, size, eraser);
    send({t:'stroke', x0:lx, y0:ly, x1:lx+0.1, y1:ly+0.1, color, size, eraser});
  }
  function onMove(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = toLogic(e);
    drawSeg(lx, ly, p.x, p.y, color, size, eraser);
    send({t:'stroke', x0:lx, y0:ly, x1:p.x, y1:p.y, color, size, eraser});
    lx = p.x; ly = p.y;
  }
  function onUp() { drawing = false; }
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, {passive:false});
  cv.addEventListener('touchmove', onMove, {passive:false});
  cv.addEventListener('touchend', onUp);

  // ---------- 工具 ----------
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function addChat(html, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + (cls || '');
    d.innerHTML = html;
    const log = $('chatLog');
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function setTimer(sec) {
    clearInterval(timerInt);
    timeLeft = sec;
    $('timer').textContent = timeLeft;
    $('timer').classList.toggle('low', timeLeft <= 10);
    timerInt = setInterval(() => {
      timeLeft--;
      $('timer').textContent = Math.max(0, timeLeft);
      $('timer').classList.toggle('low', timeLeft <= 10);
      if (timeLeft <= 0) clearInterval(timerInt);
    }, 1000);
  }
  function renderPlayers(players, drawerId, correctIds) {
    $('playerList').innerHTML = players.map(p => `
      <div class="pRow ${p.id===drawerId ? 'drawing' : ''}">
        <span>${p.id===drawerId ? '<span class="brush">🖌️</span>' : (p.isHost ? '👑' : '👤')}</span>
        <span class="nm">${esc(p.name)}${p.id===myId ? '（我）' : ''}</span>
        ${correctIds && correctIds.has(p.id) ? '<span class="ok">✓</span>' : ''}
        <span class="sc">${p.score}分</span>
      </div>`).join('');
  }
  let lastPlayers = [], lastDrawer = null, correctIds = new Set();

  // ---------- 大厅 ----------
  $('joinBtn').onclick = () => {
    const name = $('nameInput').value.trim();
    const room = $('roomInput').value.trim();
    if (!name) { $('lobbyErr').textContent = '先起个名儿'; return; }
    if (!room) { $('lobbyErr').textContent = '填个房间号（和朋友约定同一个）'; return; }
    $('lobbyErr').textContent = '连接中…';
    ws = new WebSocket(WS_URL);
    ws.onopen = () => send({t:'join', room, name});
    ws.onclose = () => { addChat('连接断了，刷新页面重进吧', 'sys'); };
    ws.onerror = () => { $('lobbyErr').textContent = '连不上服务器，确认服务端已启动'; };
    ws.onmessage = ev => onMsg(JSON.parse(ev.data));
  };
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
  $('roomInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });

  // ---------- 消息处理 ----------
  function onMsg(m) {
    switch (m.t) {
      case 'joined':
        myId = m.playerId;
        $('lobby').style.display = 'none';
        $('game').style.display = 'block';
        $('roomTag').textContent = '房间 ' + m.room;
        addChat(`进屋了！本局词库共 ${m.words} 个招远方言词`, 'sys');
        break;

      case 'error':
        if (gameState === 'lobby' && !myId) { $('lobbyErr').textContent = m.text; }
        else addChat(esc(m.text), 'sys');
        break;

      case 'players':
        lastPlayers = m.players; hostId = m.hostId; gameState = m.state;
        renderPlayers(m.players, lastDrawer, correctIds);
        $('startBtn').style.display = (m.hostId === myId && m.state === 'lobby') ? 'inline-block' : 'none';
        if (m.state === 'lobby') $('wordBar').textContent = m.hostId === myId ? '你是房主，点下面"开始游戏"' : '等房主开局……';
        break;

      case 'gameStart':
        $('startBtn').style.display = 'none';
        $('overOverlay').style.display = 'none';
        addChat('开局！招远话整起来~', 'sys');
        break;

      case 'round':
        gameState = 'playing';
        correctIds = new Set();
        lastDrawer = m.drawerId;
        isDrawer = (m.drawerId === myId);
        white();
        $('roundOverlay').style.display = 'none';
        $('roundInfo').textContent = `第 ${m.round}/${m.totalRounds} 轮 · ${m.drawerName} 作画`;
        $('canvasWrap').classList.toggle('notMine', !isDrawer);
        $('toolbar').classList.toggle('disabled', !isDrawer);
        $('guessInput').disabled = isDrawer;
        $('guessBtn').disabled = isDrawer;
        $('guessInput').placeholder = isDrawer ? '你是画手，这轮你来画' : '输入你猜的招远话…';
        if (!isDrawer) {
          $('wordBar').innerHTML = `<span class="hintTag">${esc(m.category)}</span> 这个词 <b>${m.wordLen}</b> 个字，快看画猜招远话！`;
        }
        renderPlayers(lastPlayers, lastDrawer, correctIds);
        addChat(`第 ${m.round} 轮开始，<b>${esc(m.drawerName)}</b> 画画`, 'sys');
        setTimer(m.duration);
        break;

      case 'yourWord':
        $('wordBar').innerHTML = `你画：<span class="wd">${esc(m.word)}</span> <span style="color:#888;font-size:14px;">（${esc(m.meaning)}）</span>`;
        break;

      case 'stroke':
        drawSeg(m.x0, m.y0, m.x1, m.y1, m.color, m.size, m.eraser);
        break;

      case 'clear':
        white();
        break;

      case 'chat':
        addChat(m.sys ? esc(m.text) : `<span class="nm">${esc(m.name)}：</span>${esc(m.text)}`, m.sys ? 'sys' : '');
        break;

      case 'hint':
        addChat('💡 提示：' + esc(m.hint), 'sys');
        break;

      case 'correct':
        correctIds.add(m.playerId);
        lastPlayers = m.players;
        renderPlayers(lastPlayers, lastDrawer, correctIds);
        addChat(`🎉 <b>${esc(m.name)}</b> 猜对了！+${m.gain}分（剩${m.timeLeft}秒）`, 'good');
        if (m.playerId === myId) { $('guessInput').disabled = true; $('guessInput').placeholder = '你已猜对，看别人表演'; }
        break;

      case 'roundEnd':
        gameState = 'revealing';
        clearInterval(timerInt);
        isDrawer = false;
        $('toolbar').classList.add('disabled');
        $('roTitle').textContent = m.reason === 'allCorrect' ? '全员猜对！' : (m.reason === 'timeup' ? '时间到！' : '画手掉线了…');
        $('roWord').textContent = m.word;
        $('roMean').textContent = `【${m.category}】${m.meaning}`;
        $('roundOverlay').style.display = 'flex';
        lastPlayers = m.players;
        renderPlayers(lastPlayers, lastDrawer, correctIds);
        addChat(`答案揭晓：<b>${esc(m.word)}</b>（${esc(m.meaning)}）`, 'good');
        let cd = 5;
        const cdInt = setInterval(() => { cd--; $('countdownNum').textContent = cd > 0 ? `${cd} 秒后下一轮…` : '…'; if (cd <= 0) clearInterval(cdInt); }, 1000);
        break;

      case 'gameOver':
        gameState = 'over';
        $('roundOverlay').style.display = 'none';
        $('rankList').innerHTML = m.ranking.map((p,i) => `
          <div class="rankRow"><span class="rk">${['🥇','🥈','🥉'][i] || (i+1)}</span>
          <span class="rn">${esc(p.name)}${p.id===myId?'（我）':''}</span>
          <span class="rs">${p.score}分</span></div>`).join('');
        $('againBtn').style.display = (hostId === myId) ? 'inline-block' : 'none';
        $('againTip').style.display = (hostId === myId) ? 'none' : 'block';
        $('overOverlay').style.display = 'flex';
        $('roundInfo').textContent = '本局结束';
        break;
    }
  }

  // ---------- 猜词 ----------
  function submitGuess() {
    const v = $('guessInput').value.trim();
    if (!v) return;
    send({t:'guess', text:v});
    $('guessInput').value = '';
  }
  $('guessBtn').onclick = submitGuess;
  $('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitGuess(); });

  $('startBtn').onclick = () => send({t:'start'});
  $('againBtn').onclick = () => { $('overOverlay').style.display = 'none'; send({t:'again'}); };
})();
</script>
</body>
</html>
